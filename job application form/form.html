<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>

<body>

    <h1>Job Application Form</h1>

    <form>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName">
        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <label for="college">College Name:</label>
        <input type="text" id="college" name="college">
        <br><br>

        <label for="state">State:</label>

        <select id="state" name="state">
            <option value="">Select State</option>
            <option value="andhra-pradesh">Andhra Pradesh</option>
            <option value="telangana">Telangana</option>
            <option value="karnataka">Karnataka</option>
            <option value="tamil-nadu">Tamil Nadu</option>
            <option value="kerala">Kerala</option>
        </select>

        <br><br>

        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="4" cols="40"></textarea>

        <br><br>

        <label>Skills:</label>
        <br>

        <input type="checkbox" id="java" name="skills" value="java">
        <label for="java">Java</label>
        <br>

        <input type="checkbox" id="springboot" name="skills" value="springboot">
        <label for="springboot">Spring Boot</label>
        <br>

        <input type="checkbox" id="api" name="skills" value="api-integration">
        <label for="api">API Integration</label>
        <br>

        <input type="checkbox" id="postman" name="skills" value="postman">
        <label for="postman">Postman</label>
        <br>

        <input type="checkbox" id="sql" name="skills" value="sql">
        <label for="sql">SQL</label>
        <br>

        <input type="checkbox" id="mysql" name="skills" value="mysql">
        <label for="mysql">MySQL</label>
        <br>

        <input type="checkbox" id="react" name="skills" value="react">
        <label for="react">React</label>

        <br><br>

        <label>Languages:</label>
        <br>

        <input type="checkbox" id="english" name="languages" value="english">
        <label for="english">English</label>
        <br>

        <input type="checkbox" id="telugu" name="languages" value="telugu">
        <label for="telugu">Telugu</label>
        <br>

        <input type="checkbox" id="kannada" name="languages" value="kannada">
        <label for="kannada">Kannada</label>
        <br>

        <input type="checkbox" id="hindi" name="languages" value="hindi">
        <label for="hindi">Hindi</label>

        <br><br>

        <label for="resume">Resume:</label>
        <input type="file" id="resume" name="resume">

        <br><br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
